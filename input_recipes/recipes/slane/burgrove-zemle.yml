name: Burgrové žemle
portions: '7ks'
ingredients:
  main:
  - 420g hladká múka
  - 80g mlieko
  - 120g voda
  - 1 vajce
  - 30g maslo
  - 15g soli
  - 50g cukor
  - (voliteľne) polovica balenia mrazeného špenátu
  - droždie
preparation:
- všetko zmiešať
- pridať rozmrazený špenát a vymiešať jednoliate cesto, podľa potreby pridať múku, nechať podkysnúť 1-2h
- urobiť guličky (žemle) a nechať kysnúť 1h
- potrieť vajíčkom, posypať sezamom
- piecť 15-18 minút, 190C
notes: ''
