name: Pad Thai s tofu
portions: '5-6 porcií'
ingredients:
  main:
  - 500g teriyaki tofu
  - 400g rezance
  - olej
  - 250g mrkva
  - 6 jarných cibuliek
  - 15g čerstvý koriander
  - 150g nasekané arašidy
  - 200g mungo klíčky
  - chilli paprička
  - limetka
  other:
    Omáčka:
    - 8PL sójovka
    - 1PL ryžový ocot
    - 8PL javorový sirup
    - 4PL limetková šťava
    - 2ČL sriracha
preparation:
- Nakrájaj mrkvu na tenké pásiky, nasekaj jarnú cibuľku, koriander a arašidy. Tofu nakrájaj na kocky veľkosti približne 1,5 cm.
- Dozlatista opeč tofu, potom pridaj uvarené rezance, zeleninu a zmiešanú omáčku.
- Miešaj, kým sa všetko zohreje.
- Posyp arašidmi, čili a ďalším koriandrom. Podávaj s mesiačikmi limetky a klíčkami mungo fazule. 
- Pred jedlom dochuť limetkovou šťavou podľa chuti.
notes: ''
