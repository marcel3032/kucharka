name: Oreo
portions: 25+
ingredients:
  main:
  - 160g hladká múka
  - 50g holandské kakao
  - 1ČL sóda bikarbóna
  - štipka soli
  - 125g maslo
  - 150g kryštálový cukor
  - 50g hnedý cukor
  - 1 vajko
  - 1ČL vankilkový extrakt
  other:
    Krém:
    - 60g maslo
    - 50g hera
    - 210g práškový cukor
    - 1ČL vankilkový extrakt
preparation:
- Vymiešame maslo s cukrom, pridáme vajce a vaniklový extrakt, znova vymiešame.
- Pridáme zvyšné ingrediencie a vyrobíme tuhé cesto.
- Cesto rozdelíme na menšie guľky, cca 10g (v pôvodnom recepte 13, bolo to veľa)
- Guľky roztlačíme spodkom pohára, ale nie úplne do veľkosti, akej chceme mať kekse, lebo sa ešte trochu zväčšia v rúre.
- Pečieme 8-10 minút na 180°C
- Kým sa pečú, zvyšné neroztlačené guľky necháme chillovať v chladničke.
- Zo všetkých potrebných surovýn vymiešame krém.
notes: ''
