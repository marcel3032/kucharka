name: Najlepší jablkový mrežovník
photo:
  path: images/jablkovy-kolac
  height: 5.5cm
portions: '1ks (30 cm)'
ingredients:
  main:
  - 275 g hladkej múky
  - 100 g práškového cukru
  - 1 štipka soli
  - 1/2 ČL prášku do pečiva
  - 125 g masla alebo Hery
  - 1 vajce
  other:
    plnka:
    - 7-8 stredne veľkých jabĺk
    - 3 PL kryštálového cukru
    - 2 ČL mletej škorice
    - 1 PL citrónovej šťavy
    - 2 PL Zlatého klasu
    - 4 PL strúhanky
    - 1 vajce na potretie
    - kryštálový cukor na posypanie
preparation:
- Zmiešajte múku, práškový cukor, soľ a prášok do pečiva. Pridajte studené maslo nakrájané na kocky, vajce a vodu. Vypracujte cesto, zabaľte a nechajte odpočívať v chladničke.
- Jablká ošúpte, nastrúhajte a vyžmýkajte. Poduste s cukrom, škoricou a citrónovou šťavou do zmäknutia.
- Zlatý klas rozmiešajte v troche vody, vmiešajte do jabĺk a nechajte prevrieť. Odstavte a nechajte mierne vychladnúť.
- Dve tretiny cesta rozvaľkajte a vyložte ním formu s priemerom 30 cm. Dno posypte strúhankou a rozložte jablkovú náplň.
- Zvyšné cesto rozvaľkajte, nakrájajte na pásy a vytvorte mriežku. Potrite rozšľahaným vajcom a posypte kryštálovým cukrom.
- Pečte pri 180 °C približne 35 minút dozlatista.
